name: Apply Gear v5.0.1 retry

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/gear-runtime-v5.0.1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply runtime patch and update compatibility contract
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/ci.yml').read_text()
          marker = "          python3 <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          patch_program = textwrap.dedent(workflow[start:end])
          exec(compile(patch_program, 'gear-hotfix-program', 'exec'))

          harness_path = Path('scripts/master_validation_harness.js')
          harness = harness_path.read_text()
          old = """test('input drivers cover framework and contenteditable controls', () => {
            includes('HTMLTextAreaElement.prototype');
            includes('HTMLInputElement.prototype');
            includes('setContentEditableValue');
            includes("new InputEvent('beforeinput'");
          });"""
          new = """test('input drivers cover framework and contenteditable controls', () => {
            assert(
              source.includes('HTMLTextAreaElement.prototype') || source.includes('view.HTMLTextAreaElement?.prototype'),
              'Missing textarea native-value prototype driver'
            );
            assert(
              source.includes('HTMLInputElement.prototype') || source.includes('view.HTMLInputElement?.prototype'),
              'Missing input native-value prototype driver'
            );
            includes('setContentEditableValue');
            includes("new InputEvent('beforeinput'");
          });"""
          if old not in harness:
              raise SystemExit('Missing input-driver contract block')
          harness_path.write_text(harness.replace(old, new, 1))
          PY

          node --check scripts/auto-driller-master.user.js
          node scripts/master_validation_harness.js
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm .github/workflows/gear-hotfix-retry.yml

      - name: Commit validated Gear hotfix
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/auto-driller-master.user.js scripts/master_validation_harness.js .github/workflows/ci.yml .github/workflows/gear-hotfix-retry.yml
          git commit -m "fix: restore Gear runtime compatibility"
          git push origin HEAD:${{ github.head_ref }}
