name: Auto Driller — CI Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Run legacy and master validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source identity
        shell: bash
        run: |
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.event.pull_request.base.sha }}"
            git merge-base --is-ancestor "${{ github.event.pull_request.base.sha }}" HEAD
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run complete validation suite
        run: npm test

      - name: Audit preserved lint debt
        run: npx eslint scripts/ --ext .js --ignore-pattern '*validation_harness.js'
        continue-on-error: true

  script-health:
    name: Userscript health checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source identity
        shell: bash
        run: |
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.event.pull_request.base.sha }}"
            git merge-base --is-ancestor "${{ github.event.pull_request.base.sha }}" HEAD
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify userscript metadata and syntax
        run: |
          set -euo pipefail
          for f in scripts/*.user.js; do
            grep -q '^// ==UserScript==$' "$f" || { echo "MISSING metadata start: $f"; exit 1; }
            grep -q '^// ==/UserScript==$' "$f" || { echo "MISSING metadata end: $f"; exit 1; }
            metadata="$(sed -n '/^\/\/ ==UserScript==$/,/^\/\/ ==\/UserScript==$/p' "$f")"
            grep -q '@name' <<<"$metadata" || { echo "MISSING @name in metadata: $f"; exit 1; }
            grep -q '@version' <<<"$metadata" || { echo "MISSING @version in metadata: $f"; exit 1; }
            grep -q '@match' <<<"$metadata" || { echo "MISSING @match in metadata: $f"; exit 1; }
            node --check "$f"
            echo "OK: $f"
          done

      - name: Enforce safety contracts
        run: |
          set -euo pipefail
          SCRIPT=scripts/auto-driller-master.user.js
          ! grep -F ':has-text(' "$SCRIPT"
          ! grep -F 'button:has(svg)' "$SCRIPT"
          ! grep -F 'path: /^\/i\/grok|.*/' "$SCRIPT"
          grep -F 'if (!config.enabled || !config.autoAccept || !approval) return' "$SCRIPT"
          grep -F 'assertOperationActive(operationGeneration)' "$SCRIPT"
          grep -F 'clearTimeout(state.baselineTimer)' "$SCRIPT"
          grep -F 'if (!candidate.strong || !candidate.text) return' "$SCRIPT"
          grep -F 'Date.now() - rootsCachedAt < 750' "$SCRIPT"
          grep -F 'state.backoffUntil = 0' "$SCRIPT"
          grep -F '// @version      5.1.0' "$SCRIPT"
          grep -F "const VERSION = '5.1.0'" "$SCRIPT"

      - name: Check script sizes
        run: |
          wc -c scripts/*.user.js
          test "$(wc -c < scripts/auto-driller-master.user.js)" -lt 100000
