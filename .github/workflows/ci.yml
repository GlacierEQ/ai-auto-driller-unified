name: Auto Driller — CI Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-release-edge-fixes:
    name: Apply final release edge fixes
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/auto-driller-v5-master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply and validate edge fixes
        run: |
          set -euo pipefail
          git apply --check .github/v5-release-fix.patch
          git apply .github/v5-release-fix.patch
          rm .github/v5-release-fix.patch
          node --check scripts/auto-driller-master.user.js
          node scripts/master_validation_harness.js

      - name: Commit edge fixes
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/auto-driller-master.user.js scripts/master_validation_harness.js .github/v5-release-fix.patch
          git commit -m "fix: close final Auto Driller v5 release edge cases"
          git push origin HEAD:${{ github.head_ref }}

  validate:
    name: Run legacy and master validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run complete validation suite
        run: npm test

      - name: Lint runtime scripts
        run: npx eslint scripts/ --ext .js --ignore-pattern '*validation_harness.js' || true
        continue-on-error: true

  script-health:
    name: Userscript health checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify userscript metadata
        run: |
          set -euo pipefail
          for f in scripts/*.user.js; do
            grep -q "@name" "$f" || { echo "MISSING @name: $f"; exit 1; }
            grep -q "@version" "$f" || { echo "MISSING @version: $f"; exit 1; }
            grep -q "@match" "$f" || { echo "MISSING @match: $f"; exit 1; }
            echo "OK: $f"
          done

      - name: Enforce safety contracts
        run: |
          set -euo pipefail
          SCRIPT=scripts/auto-driller-master.user.js
          ! grep -F ':has-text(' "$SCRIPT"
          ! grep -F 'button:has(svg)' "$SCRIPT"
          ! grep -F 'path: /^\/i\/grok|.*/' "$SCRIPT"
          grep -F 'if (!config.enabled || !config.autoAccept || !approval) return' "$SCRIPT"
          grep -F 'assertOperationActive(operationGeneration)' "$SCRIPT"
          grep -F 'clearTimeout(state.baselineTimer)' "$SCRIPT"
          grep -F 'if (!candidate.strong || !candidate.text) return' "$SCRIPT"

      - name: Check script sizes
        run: |
          wc -c scripts/*.user.js
          test "$(wc -c < scripts/auto-driller-master.user.js)" -lt 100000
