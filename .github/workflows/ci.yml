name: Auto Driller — CI Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-final-safety-pass:
    name: Apply final v5 safety pass
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/auto-driller-v5-master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply exact reviewed payload
        run: |
          set -euo pipefail
          RUNTIME_PATCH_GZ_B64="$(sed -n 's/^          RUNTIME_PATCH_GZ_B64: //p' .github/workflows/apply-v5-final.yml)"
          HARNESS_GZ_B64="$(sed -n 's/^          HARNESS_GZ_B64: //p' .github/workflows/apply-v5-final.yml)"
          test -n "$RUNTIME_PATCH_GZ_B64"
          test -n "$HARNESS_GZ_B64"
          printf '%s' "$RUNTIME_PATCH_GZ_B64" | base64 -d | gzip -d > /tmp/final-runtime.patch
          git apply --check /tmp/final-runtime.patch
          git apply /tmp/final-runtime.patch
          printf '%s' "$HARNESS_GZ_B64" | base64 -d | gzip -d > scripts/master_validation_harness.js
          rm .github/workflows/apply-v5-final.yml
          node --check scripts/auto-driller-master.user.js
          node scripts/master_validation_harness.js

      - name: Commit final safety pass
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/auto-driller-master.user.js scripts/master_validation_harness.js .github/workflows/apply-v5-final.yml
          git commit -m "fix: complete Auto Driller v5 release safety pass"
          git push origin HEAD:${{ github.head_ref }}

  validate:
    name: Run legacy and master validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run complete validation suite
        run: npm test

      - name: Lint runtime scripts
        run: npx eslint scripts/ --ext .js --ignore-pattern '*validation_harness.js' || true
        continue-on-error: true

  script-health:
    name: Userscript health checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify userscript metadata
        run: |
          set -euo pipefail
          for f in scripts/*.user.js; do
            grep -q "@name" "$f" || { echo "MISSING @name: $f"; exit 1; }
            grep -q "@version" "$f" || { echo "MISSING @version: $f"; exit 1; }
            grep -q "@match" "$f" || { echo "MISSING @match: $f"; exit 1; }
            echo "OK: $f"
          done

      - name: Reject unsafe selector patterns
        run: |
          set -euo pipefail
          ! grep -F ':has-text(' scripts/auto-driller-master.user.js
          ! grep -F 'button:has(svg)' scripts/auto-driller-master.user.js
          ! grep -F 'path: /^\/i\/grok|.*/' scripts/auto-driller-master.user.js

      - name: Check script sizes
        run: |
          wc -c scripts/*.user.js
          test "$(wc -c < scripts/auto-driller-master.user.js)" -lt 100000
