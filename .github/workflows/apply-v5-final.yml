name: Apply Auto Driller v5 final safety pass

on:
  push:
    branches: [feat/auto-driller-v5-master]
    paths: [.github/workflows/apply-v5-final.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: feat/auto-driller-v5-master
          fetch-depth: 0

      - name: Apply final runtime and validation harness
        env:
          RUNTIME_PATCH_GZ_B64: 
          HARNESS_GZ_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$RUNTIME_PATCH_GZ_B64" | base64 -d | gzip -d > /tmp/final-runtime.patch
          git apply --check /tmp/final-runtime.patch
          git apply /tmp/final-runtime.patch
          printf '%s' "$HARNESS_GZ_B64" | base64 -d | gzip -d > scripts/master_validation_harness.js
          rm .github/workflows/apply-v5-final.yml
          node --check scripts/auto-driller-master.user.js
          node scripts/master_validation_harness.js

      - name: Commit final safety pass
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/auto-driller-master.user.js scripts/master_validation_harness.js .github/workflows/apply-v5-final.yml
          git commit -m "fix: complete Auto Driller v5 release safety pass"
          git push origin HEAD:feat/auto-driller-v5-master
